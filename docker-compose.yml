# Optional — only needed once you outgrow the embedded Qdrant + SQLite setup described in
# README.md. Local development does NOT require this file or Docker at all.
#
# Usage: docker compose up -d
# Then in backend/.env set:
#   QDRANT_URL=http://localhost:6333
#   DATABASE_URL=postgresql://sanjivani:sanjivani@localhost:5432/sanjivani

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanjivani
      POSTGRES_PASSWORD: sanjivani
      POSTGRES_DB: sanjivani
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_data:
